apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mlbb-coach-ai
  labels:
    app: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: mlbb-coach-ai/api-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "api-gateway"
            - name: SERVICE_PORT
              value: "8000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: PYTHONPATH
              value: "/app"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mlbb-secrets
                  key: openai-api-key
            - name: OCR_SERVICE_URL
              value: "http://ocr-service:8001"
            - name: DETECTION_SERVICE_URL
              value: "http://detection-service:8002"
            - name: ANALYSIS_SERVICE_URL
              value: "http://analysis-service:8003"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: temp-storage
              mountPath: /app/temp
            - name: logs-storage
              mountPath: /app/logs
      volumes:
        - name: temp-storage
          emptyDir: {}
        - name: logs-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mlbb-coach-ai
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: mlbb-coach-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
