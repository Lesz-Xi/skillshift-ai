apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: mlbb-coach-ai
  labels:
    app: analysis-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analysis-service
  template:
    metadata:
      labels:
        app: analysis-service
    spec:
      containers:
        - name: analysis-service
          image: mlbb-coach-ai/analysis-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: SERVICE_NAME
              value: "analysis-service"
            - name: SERVICE_PORT
              value: "8003"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: PYTHONPATH
              value: "/app"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mlbb-secrets
                  key: openai-api-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: temp-storage
              mountPath: /app/temp
      volumes:
        - name: temp-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: analysis-service
  namespace: mlbb-coach-ai
  labels:
    app: analysis-service
spec:
  selector:
    app: analysis-service
  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analysis-service-hpa
  namespace: mlbb-coach-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analysis-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
