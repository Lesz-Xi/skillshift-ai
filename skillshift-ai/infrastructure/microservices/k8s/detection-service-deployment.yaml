apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-service
  namespace: mlbb-coach-ai
  labels:
    app: detection-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: detection-service
  template:
    metadata:
      labels:
        app: detection-service
    spec:
      containers:
        - name: detection-service
          image: mlbb-coach-ai/detection-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: SERVICE_NAME
              value: "detection-service"
            - name: SERVICE_PORT
              value: "8002"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: PYTHONPATH
              value: "/app"
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: temp-storage
              mountPath: /app/temp
            - name: models-storage
              mountPath: /app/models
      volumes:
        - name: temp-storage
          emptyDir: {}
        - name: models-storage
          persistentVolumeClaim:
            claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: detection-service
  namespace: mlbb-coach-ai
  labels:
    app: detection-service
spec:
  selector:
    app: detection-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: detection-service-hpa
  namespace: mlbb-coach-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: detection-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: mlbb-coach-ai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
