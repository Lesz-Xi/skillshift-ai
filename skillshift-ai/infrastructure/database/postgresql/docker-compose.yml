version: "3.8"

services:
  # PostgreSQL Primary (Master)
  postgres-primary:
    image: postgres:15-alpine
    container_name: postgres-primary
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mlbb_coach_ai
      POSTGRES_USER: mlbb_user
      POSTGRES_PASSWORD: mlbb_password_2025
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_password_2025
      PGUSER: mlbb_user
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init-scripts:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlbb_user -d mlbb_coach_ai"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Read Replica 1
  postgres-replica-1:
    image: postgres:15-alpine
    container_name: postgres-replica-1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mlbb_coach_ai
      POSTGRES_USER: mlbb_user
      POSTGRES_PASSWORD: mlbb_password_2025
      PGUSER: postgres
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_password_2025
    volumes:
      - postgres-replica-1-data:/var/lib/postgresql/data
      - ./config/postgresql-replica.conf:/etc/postgresql/postgresql.conf
      - ./scripts/setup-replica.sh:/setup-replica.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      sh -c "
        chmod +x /setup-replica.sh &&
        /setup-replica.sh &&
        postgres -c config_file=/etc/postgresql/postgresql.conf
      "
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlbb_user -d mlbb_coach_ai"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # PostgreSQL Read Replica 2
  postgres-replica-2:
    image: postgres:15-alpine
    container_name: postgres-replica-2
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: mlbb_coach_ai
      POSTGRES_USER: mlbb_user
      POSTGRES_PASSWORD: mlbb_password_2025
      PGUSER: postgres
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_password_2025
    volumes:
      - postgres-replica-2-data:/var/lib/postgresql/data
      - ./config/postgresql-replica.conf:/etc/postgresql/postgresql.conf
      - ./scripts/setup-replica.sh:/setup-replica.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      sh -c "
        chmod +x /setup-replica.sh &&
        /setup-replica.sh &&
        postgres -c config_file=/etc/postgresql/postgresql.conf
      "
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlbb_user -d mlbb_coach_ai"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # PgBouncer Connection Pooler
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: pgbouncer
    ports:
      - "6432:5432"
    environment:
      DATABASES_HOST: postgres-primary
      DATABASES_PORT: 5432
      DATABASES_USER: mlbb_user
      DATABASES_PASSWORD: mlbb_password_2025
      DATABASES_DBNAME: mlbb_coach_ai
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 100
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 20
      SERVER_RESET_QUERY: DISCARD ALL
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/userlist.txt:/etc/pgbouncer/userlist.txt
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - postgres-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -h localhost -p 5432 -U mlbb_user -d mlbb_coach_ai -c 'SELECT 1;'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Monitoring with pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mlbb-coach-ai.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_2025
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres-primary
    networks:
      - postgres-network

  # Database Backup Service
  postgres-backup:
    image: postgres:15-alpine
    container_name: postgres-backup
    environment:
      PGPASSWORD: mlbb_password_2025
    volumes:
      - postgres-backups:/backups
      - ./scripts/backup.sh:/backup.sh
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      sh -c "
        chmod +x /backup.sh &&
        while true; do
          /backup.sh
          sleep 3600
        done
      "
    networks:
      - postgres-network

networks:
  postgres-network:
    driver: bridge

volumes:
  postgres-primary-data:
  postgres-replica-1-data:
  postgres-replica-2-data:
  pgadmin-data:
  postgres-backups:
