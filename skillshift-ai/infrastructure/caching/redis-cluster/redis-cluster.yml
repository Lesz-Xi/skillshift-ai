version: "3.8"

services:
  # Redis Cluster Nodes
  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    ports:
      - "7000:6379"
      - "17000:16379"
    volumes:
      - redis-node-1-data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster-network
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_PORT=16379

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-node-2
    ports:
      - "7001:6379"
      - "17001:16379"
    volumes:
      - redis-node-2-data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster-network
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_PORT=16379

  redis-node-3:
    image: redis:7-alpine
    container_name: redis-node-3
    ports:
      - "7002:6379"
      - "17002:16379"
    volumes:
      - redis-node-3-data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster-network
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_PORT=16379

  redis-node-4:
    image: redis:7-alpine
    container_name: redis-node-4
    ports:
      - "7003:6379"
      - "17003:16379"
    volumes:
      - redis-node-4-data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster-network
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_PORT=16379

  redis-node-5:
    image: redis:7-alpine
    container_name: redis-node-5
    ports:
      - "7004:6379"
      - "17004:16379"
    volumes:
      - redis-node-5-data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster-network
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_PORT=16379

  redis-node-6:
    image: redis:7-alpine
    container_name: redis-node-6
    ports:
      - "7005:6379"
      - "17005:16379"
    volumes:
      - redis-node-6-data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - redis-cluster-network
    environment:
      - REDIS_PORT=6379
      - REDIS_CLUSTER_PORT=16379

  # Redis Cluster Setup
  redis-cluster-setup:
    image: redis:7-alpine
    container_name: redis-cluster-setup
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    networks:
      - redis-cluster-network
    command: >
      sh -c "
        sleep 10 &&
        redis-cli --cluster create 
        redis-node-1:6379 
        redis-node-2:6379 
        redis-node-3:6379 
        redis-node-4:6379 
        redis-node-5:6379 
        redis-node-6:6379 
        --cluster-replicas 1 
        --cluster-yes
      "

  # Redis Cluster Monitor
  redis-cluster-monitor:
    image: redis:7-alpine
    container_name: redis-cluster-monitor
    depends_on:
      - redis-cluster-setup
    networks:
      - redis-cluster-network
    volumes:
      - ./scripts/monitor-cluster.sh:/monitor-cluster.sh
    command: >
      sh -c "
        chmod +x /monitor-cluster.sh &&
        sleep 30 &&
        /monitor-cluster.sh
      "
    restart: unless-stopped

networks:
  redis-cluster-network:
    driver: bridge

volumes:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:
