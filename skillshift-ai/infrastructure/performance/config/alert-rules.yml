groups:
  - name: mlbb-coach-ai-alerts
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}"

      # High Disk Usage
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"}) / node_filesystem_size_bytes{fstype!="tmpfs"} * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "High disk usage detected"
          description: "Disk usage is above 90% for more than 5 minutes on {{ $labels.instance }} at {{ $labels.mountpoint }}"

      # Service Down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} service is down on {{ $labels.instance }}"

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is above 1 second for {{ $labels.job }}"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: error
          service: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for more than 5 minutes in {{ $labels.job }}"

      # Low Cache Hit Rate
      - alert: LowCacheHitRate
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) * 100 < 70
        for: 10m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Redis cache hit rate is below 70% for more than 10 minutes"

      # Database Connection Pool Exhaustion
      - alert: DatabaseConnectionPoolHigh
        expr: postgres_stat_database_numbackends / postgres_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Database connection pool usage high"
          description: "PostgreSQL connection pool usage is above 80%"

      # Redis Memory Usage High
      - alert: RedisMemoryUsageHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: cache
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is above 90% of configured maximum"

      # Container Restart
      - alert: ContainerRestart
        expr: increase(container_start_time_seconds[1h]) > 0
        labels:
          severity: warning
          service: container
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} has restarted within the last hour"

      # AI Model Processing Time High
      - alert: AIModelProcessingTimeHigh
        expr: histogram_quantile(0.95, rate(mlbb_ai_processing_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: ai
        annotations:
          summary: "AI model processing time high"
          description: "95th percentile AI processing time is above 5 seconds"

      # OCR Processing Failure Rate High
      - alert: OCRProcessingFailureRateHigh
        expr: rate(mlbb_ocr_processing_failures_total[5m]) / rate(mlbb_ocr_processing_total[5m]) * 100 > 10
        for: 5m
        labels:
          severity: error
          service: ocr
        annotations:
          summary: "OCR processing failure rate high"
          description: "OCR processing failure rate is above 10%"

      # Queue Size High
      - alert: QueueSizeHigh
        expr: mlbb_queue_size > 1000
        for: 5m
        labels:
          severity: warning
          service: queue
        annotations:
          summary: "Queue size is high"
          description: "Queue size has been above 1000 for more than 5 minutes"

      # SSL Certificate Expiry
      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 30
        labels:
          severity: warning
          service: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in less than 30 days"
