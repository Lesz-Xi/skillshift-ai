evaluation:
  bias_threshold: 0.05
  confidence_threshold: 0.25
  confusion_matrix: true
  iou_threshold: 0.5
  match_type_aware: true
  metrics:
  - precision
  - recall
  - f1
  - map50
  - map95
  per_class_metrics: true
names:
- hero_icon_ally_1
- hero_icon_ally_2
- hero_icon_ally_3
- hero_icon_ally_4
- hero_icon_ally_5
- hero_icon_enemy_1
- hero_icon_enemy_2
- hero_icon_enemy_3
- hero_icon_enemy_4
- hero_icon_enemy_5
- mvp_badge
- mvp_loss_badge
- medal_gold
- medal_silver
- medal_bronze
- match_type_classic
- match_type_ranked
- match_type_brawl
- match_type_custom
- victory_text
- defeat_text
- kda_display
- player_name
- gold_amount
- gpm_display
- damage_dealt
- damage_taken
- healing_done
- participation_rate
- turret_damage
- match_duration
- team_indicator_ally
- team_indicator_enemy
- scoreboard_container
- item_icon_1
- item_icon_2
- item_icon_3
- item_icon_4
- item_icon_5
- item_icon_6
- battle_spell_1
- battle_spell_2
- savage_indicator
- maniac_indicator
- legendary_indicator
- role_indicator
- position_rank
- ui_complete
- text_readable
- icons_clear
nc: 50
path: .
test: images/test
train: images/train
train_params:
  batch_size: 16
  class_weights:
    ranked: 1.0
  epochs: 100
  imgsz: 640
  lr0: 0.001
  match_type_distribution:
    ranked: 64
  optimizer: AdamW
  weight_decay: 0.0005
val: images/val
validation:
  early_stopping:
    min_delta: 0.001
    patience: 20
  frequency: 5
  save_best: true
